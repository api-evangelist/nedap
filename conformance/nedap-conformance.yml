method: searched
source: >-
  openapi/nedap-ons-openapi-original.json, https://ons-api.nl/english/technical/FHIR-ZIBS-GettingStartedWithFhir.html,
  https://ons-api.nl/english/technical/Certificate_requirements.html
api: Nedap Ons API
note: >-
  Nedap Ons sits inside the Dutch care-information ecosystem, and its contract shows
  it: openEHR archetypes and compositions are a first-class part of the API surface,
  the domain models cite ZIBs (zorginformatiebouwstenen) by name and version, SNOMED CT
  and HL7 NullFlavor codes appear in field descriptions, and the national identifier
  systems BSN and AGB are used verbatim as FHIR NamingSystem URIs. What is NOT in the
  public contract is the FHIR resource surface itself: the docs describe read and
  search endpoints at /v0/fhir/<Resource> with a capability statement at
  /v0/fhir/metadata, but the published openapi.json contains none of them — only three
  FHIR R3 bundle-wrapper endpoints for the ZorgDomein and referral modules. Nedap says
  the FHIR endpoints "are available in the Ons API Dashboard", which is login-gated, so
  a public reader can read the FHIR conventions but cannot obtain the FHIR contract.
standards:
- id: openehr
  conforms: true
  domain_standard: true
  evidence: >-
    31 openEHR paths in the published spec (/v0/openehr_dossier/... composition_wrappers,
    archetype_wrappers, composition_versions, item_tags), an
    openehr.CompositionValidationErrorResponse carrying archetypeId and archetypePath,
    and a typed validation enum including ARCHETYPE_SLOT_ID_MISMATCH and
    ARCHETYPE_NOT_FOUND. "openEHR" appears 410 times and "archetype" 387 times in the
    spec.
  spec_location: openapi/nedap-ons-openapi-original.json#/paths (/v0/openehr_dossier/*)
- id: hl7-fhir
  conforms: partial
  domain_standard: true
  evidence: >-
    Three FHIR R3 bundle-wrapper endpoints are published
    (/v0/ketenverkeer/fhir/r3/bundle_wrapper and two module variants) with FHIR Bundle
    parse errors declared as 422. The documented /v0/fhir/<Resource> read+search surface
    and the /v0/fhir/metadata CapabilityStatement are described in the docs but are NOT
    in the public OpenAPI — they are behind the Ons API Dashboard login.
  docs: https://ons-api.nl/english/technical/FHIR-ZIBS-GettingStartedWithFhir.html
- id: zib
  conforms: true
  domain_standard: true
  label: Zorginformatiebouwstenen (Dutch Health and Care Information Models)
  evidence: >-
    Domain models are described against named ZIBs — e.g. medication administration
    records "shaped somewhat according to the Medicatietoediening ZIB", and Wzd freedom-
    restricting measures pointing at zibs.nl/wiki/VrijheidsbeperkendeInterventie-v1.0(2020NL).
    Nedap publishes a dedicated ZIBs page and a FHIR/ZIBs getting-started guide.
  docs: https://ons-api.nl/english/technical/Zibs.html
- id: snomed-ct
  conforms: true
  evidence: >-
    SNOMED CT appears 55 times; FHIR search examples use the SNOMED system URI
    (http://snomed.info/sct|365470003), and MP9 medication administration reasons use
    the SNOMED subset "Codelijst" with HL7 NullFlavor OTH for deviations.
- id: bsn-agb-naming-systems
  conforms: true
  label: Dutch national identifier systems (BSN, AGB)
  evidence: >-
    Identifier search is defined against http://fhir.nl/fhir/NamingSystem/bsn
    (urn:oid:2.16.840.1.113883.2.4.6.3) for patients and
    http://fhir.nl/fhir/NamingSystem/agb-z (urn:oid:2.16.840.1.113883.2.4.6.1) for
    organisations and practitioners.
- id: omaha-system
  conforms: true
  label: Omaha System (nursing classification)
  evidence: >-
    A full Omaha classification surface in the schemas — dossier.omaha.Problem,
    ClassifiedProblem with knowledge/behaviour/status ratings, Domain,
    ModifierProblemLevel, SignOrSymptom. "Omaha" appears 209 times.
- id: dbc-ggz-nza
  conforms: true
  label: DBC/DBBC declaration rules (NZa) for Dutch mental healthcare
  evidence: >-
    dbc.ggz.ValidationError types include DBC_SPELREGEL ("Validation error for NZa
    spelregels") with real messages such as "DBC niet gesloten binnen 365 dagen";
    "DBC" appears 333 times.
- id: mutual-tls
  conforms: true
  evidence: >-
    Every request requires an SSL client certificate signed by Nedap's own CA; minimum
