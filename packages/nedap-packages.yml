source: >-
  Maven Central (search.maven.org), PyPI (pypi.org/pypi/<pkg>/json), npm registry,
  and the github.com/nedap organisation listing
note: >-
  Nedap publishes no client library for Ons API — the docs tell integrators to
  generate their own client from the OpenAPI specification instead, and the 2025
  migration guide is written around generated clients. The only first-party API client
  on a public registry is the Java library for the Nedap Retail iD Cloud API, and its
  last release was 2017-01-02, more than nine years before this check. npm, RubyGems,
  NuGet, crates.io and pkg.go.dev carry no first-party Nedap API client.
