note: >-
  Ons API has four coexisting error envelopes and no single one wins. A legacy
  field-level ErrorResponse carries the bulk of the 4xx surface; an RFC 9457-shaped
  ProblemResponse (type, title, status, detail, instance, plus reasons[] with a JSON
  Pointer per reason) exists but is declared on only 5 operations, and even there the
  media type is application/json rather than application/problem+json — the shape
  conforms, the content negotiation does not. Two product areas ship their own: the
  Kamino messaging surface uses a string error code enum, and openEHR composition
  writes return a validation entry list with an archetype path and a typed reason. An
  agent must switch on the operation, not on a provider-wide error contract.
