pointer_policy: >-
  NO MCPServer pointer is emitted in apis.yml for this artifact. Nedap operates no MCP
  server, and an MCPServer pointer asserts that the provider ships one — the same rule
  the pipeline applies to the A2A agent card and to a WellKnown manifest whose every
  path 404s. This file documents a candidate design, and a candidate is not a surface.
candidate_scope_note: >-
  Deliberately read-only. Ons API has 308 write operations against live care records
  with no idempotency key, no dry-run and no documented reversal, so a candidate tool
  surface that writes would be irresponsible to propose. See
  conventions/nedap-conventions.yml.
