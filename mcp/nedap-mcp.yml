note: >-
  Nedap ships no MCP server. Searched the Ons API docs, the github.com/nedap
  organisation (100 most-recently-updated repositories), npm and the MCP registries; no
  hosted endpoint, no stdio package, no mention of Model Context Protocol anywhere on
  Nedap's surface. The tools below are a DERIVED candidate set — a proposal shaped from
  real operationIds in the published OpenAPI, not something Nedap operates. No endpoint
  URL is guessed.
  Worth stating plainly why an MCP server here would be harder than usual: Ons API is
  mutual-TLS only, with a certificate bound to one connector and one customer
  environment, so a server would have to hold a per-customer client certificate and
  carry the acting user through X-Cupido-User-Name into Nedap's own audit trail. That is
  a real design problem in a care record, not a missing feature.
