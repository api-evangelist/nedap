aid: nedap
name: Nedap
description: Nedap N.V. is a Dutch technology company founded in 1929 and listed on Euronext Amsterdam,
  headquartered in Groenlo, the Netherlands, with roughly 1,000 employees. It builds what it calls Digital
  Twin Technology across four markets — Healthcare (the Ons electronic health record suite and MediKIT
  for general practitioners), Livestock (cow monitoring), Retail (the iD Cloud RFID inventory platform
  and iSenseOS loss prevention) and Security (Nedap Access physical identity management and long-range
  vehicle/driver identification readers). Its most openly documented API surface is Ons API at ons-api.nl,
  a 926-operation OpenAPI 3.0.3 REST contract for the Ons care platform covering client dossiers, care
  planning, scheduling, rostering, payroll and finance, together with a 31-path openEHR composition and
  archetype surface, a webhook event service described in OpenAPI 3.1 webhooks, and a small scopes-and-clearances
  authorization API. A FHIR read/search surface built on the Dutch ZIB information models is documented
  but is not in the public specification — those endpoints sit behind the Ons API Dashboard. Access is
  gated on a client TLS certificate signed by Nedap's own CA and issued through the Ons API Dashboard,
  so the specifications are public while the runtime is not.
url: https://raw.githubusercontent.com/api-evangelist/nedap/refs/heads/main/apis.yml
