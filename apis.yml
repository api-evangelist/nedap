apis:
- aid: nedap:nedap-retail-id-cloud-api
  name: Nedap Retail iD Cloud API
  description: >-
    The API for iD Cloud, Nedap's RFID item-level inventory platform for unified commerce, used to integrate
    store and supply-chain stock data with ERP and point-of-sale systems on top of an EPCIS engine. The
    developer portal and the OpenAPI description it offers sit behind a login; the API host answers unauthenticated
    requests with 401 "Missing required header: Authorization", so no public machine-readable contract
    could be harvested.
  humanURL: https://developer.nedapretail.com/
  baseURL: https://api.nedapretail.com
  tags:
  - Retail
  - RFID
  - Inventory
  - EPCIS
