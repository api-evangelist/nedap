apis:
- aid: nedap-ons-api
  name: Nedap Ons API
  description: 'The REST API for the Nedap Ons electronic health record suite used by
    Dutch care organisations. 926 operations across 782 paths covering clients,
    employees, dossiers and reports, care plans, goals and actions, medical notes,
    agenda and rostering, care allocation and orders, declarations, payroll and
    expenses, surveys and client stories — plus an openEHR composition and archetype
    surface, three FHIR R3 bundle-wrapper endpoints, and domain models written against
    the Dutch ZIBs, SNOMED CT and the Omaha System.
    Requests are authenticated with an SSL client certificate signed by Nedap''s own
    Certificate Authority and bound to one connector and one customer environment.'
  humanURL: https://ons-api.nl/english/english.html
  baseURL: https://api.ons.io
  tags:
  - Healthcare
  - Electronic Health Records
  - FHIR
  - openEHR
  - Interoperability
