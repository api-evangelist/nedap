openapi: 3.2.0
info:
  title: Nedap Practitioner API
  version: 0.0.0
  description: 'Operations tagged Practitioner across 2 of this provider''s published API definitions: nedap-ons-deprecated-openapi-original.json, nedap-ons-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-development.ons.io
tags:
- name: Practitioner
paths:
  /t/practitioners/by_agb/{agbcode}:
    get:
      tags:
      - Practitioner
      summary: Return the practitioner based on the given agbcode
      operationId: PractitionerAPI.byAgb
      parameters:
      - name: agbcode
        in: path
        description: the (primary) agbcode of an employee
        required: true
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practitioner'
      x-replaced-by: /v0/administration/practitioners/by_agb/{agbcode}
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/practitioners/by_employee/{employee_id}:
    get:
      tags:
      - Practitioner
      summary: Return the practitioner based on the given id of an employee
      operationId: PractitionerAPI.byEmployee
      parameters:
      - name: employee_id
        in: path
        description: The objectid of the employee
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practitioner'
      x-replaced-by: /v0/administration/practitioners/by_employee/{employee_id}
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/practitioners/search:
    get:
      tags:
      - Practitioner
      summary: Return the practitioners based on the given search query
      operationId: PractitionerAPI.search
      parameters:
      - name: query
        in: query
        description: 'the searchquery. for instance: the last name of a employee'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: set the max size of the returned list
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: set position in the result list to start from
        schema:
          type: integer
          format: int32
      - name: date
        in: query
        description: the date on which the practitioner should have a contract
        schema:
          type: string
          format: date
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.PractitionerList'
      x-replaced-by: /v0/administration/practitioners/search
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
