          uuid: 042f53df-37e5-4ad7-af77-16a212763bba
        requestDate: '2024-03-10'
        startDate: '2024-03-11'
        stopDate: '2024-03-12'
        status: INACTIVE
        updatedAt: '2017-10-02T21:10:43.000+02:00'
        uuid: 042f53df-37e5-4ad7-af77-16a212763bba
      xml:
        name: productAllocation
