openapi: 3.2.0
info:
  title: Nedap Debtor API
  version: 0.0.0
  description: 'Operations tagged Debtor across 2 of this provider''s published API definitions: nedap-ons-deprecated-openapi-original.json, nedap-ons-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-development.ons.io
tags:
- name: Debtor
paths:
  /t/clients/{client_id}/debtors:
    get:
      tags:
      - Debtor
      summary: Return the debtors of a Client corresponding to the given id
      operationId: DebtorAPI.byClientId
      parameters:
      - name: client_id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int64
      - name: valid_from
        in: query
        description: starting time
        schema:
          type: string
          format: date
      - name: valid_to
        in: query
        description: end time
        schema:
          type: string
          format: date
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.DebtorList'
      x-replaced-by: /v0/administration/clients/{client_id}/debtors
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/debtors:
    get:
      tags:
      - Debtor
      summary: Return a DebtorList containing all Debtors available from the DebtorAPI
      description: Filtered by Debtor type if one is provided.
      operationId: DebtorAPI.all
      parameters:
      - name: type
        in: query
        description: "The type of debtor. Null means no filtering. Possible filtering values:\n <pre>\n ORGANISATIE(0, \"Organisatie\")\n ASIELZOEKERSCENTRUM(1, \"Asielzoekerscentrum\")\n ZORGKANTOOR(2, \"Zorgkantoor\")\n ZORGVERZEKERAAR(3, \"Verzekeraar\")\n GEMEENTE(4, \"Gemeente\")\n ONDERAANNEMER(5, \"Onderaannemer\")\n CLIENT(6, \"Cliënt\")\n CLIENT_EN_ZORGVERZEKERAAR(7, \"Cliënt en verzekeraar\")\n </pre>"
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.DebtorList'
        '400':
          description: Invalid debtor type
      x-cupido-common-method: true
      x-replaced-by: /v0/administration/debtors
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/debtors/{id}:
    get:
      tags:
      - Debtor
      summary: Return the Debtor corresponding to the given id
      operationId: DebtorAPI.byId
      parameters:
      - name: id
        in: path
        description: used for selecting Debtor
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debtor'
        '404':
          description: Debtor not found
      x-cupido-common-method: true
      x-replaced-by: /v0/administration/debtors/{id}
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/debtors/x-stream-connect/data:
    get:
      tags:
      - Debtor
      summary: Return all Debtor models in a streaming manner
      operationId: DebtorAPI.streamAll
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.DebtorList'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Debtor'
        '400':
          description: Could not parse request parameter
        '404':
          description: Resource not found
        '500':
          description: Unspecified internal error
      x-cupido-common-method: true
      x-replaced-by: /v0/xstream/debtors/data
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/debtors/x-stream-connect/updates:
    get:
      tags:
      - Debtor
      summary: Return all Debtor models which where updated since the date given in the request
      operationId: DebtorAPI.streamUpdates
      parameters:
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2014-12-29T00:00:00.000'
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
