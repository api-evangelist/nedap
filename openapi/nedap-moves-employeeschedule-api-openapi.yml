            Can be after midnight, relative to the date of this RosterSlot.'
          format: date-time
        endBreakTime:
          type: string
          description: 'Regular end time of the break in this Shift (if any).

            Can be after midnight, relative to the date of this RosterSlot.'
          format: date-time
        endTime:
          type: string
