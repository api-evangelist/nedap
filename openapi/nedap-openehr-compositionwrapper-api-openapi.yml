        targetPath:
          type: string
          description: Optional archetype or RM path within target, used to tag a fine-grained element.
      description: OpenEHR ItemTag, which is a tag with a key and optional value that is associated with a target ReferenceModelObjectWrapper.
      example:
        id: 59
        key: important
        value: value
        targetPath: /content[id0.1]/data[id2]/events[id3]/data[id4]/items[id5]
    openehr.CompositionValuesForPath:
      type: object
      properties:
        path:
          type: string
          description: The requested path
        values:
          type: array
          items:
            type: string
          description: List of JSON-encoded values for the requested path in this composition
      description: Combination of requested path and its values in this composition
      example:
        path: /data[id2]/events[id3]/time/value
        values:
        - '"2021-06-16T11:18:30+0100"'
    openehr.LifecycleState:
      enum:
      - ABANDONED
      - COMPLETE
      - DELETED
      - INACTIVE
      - INCOMPLETE
      type: string
      description: The lifecycle state of a composition version.
      example: COMPLETE
    openehr.ReferenceModelObjectForm:
      enum:
      - RM_OBJECT
      - PATHS_AND_VALUES
      - METADATA
      - RM_OBJECT_STANDARDS_COMPLIANT_JSON
      type: string
      description: 'ReferenceModelObjectForm enum.

        * **METADATA**: Return only the metadata. `referenceModelObject` and `pathsAndValues` will be empty.

        * **PATHS_AND_VALUES**: Return the `pathsAndValues`. `referenceModelObject` will be empty.

        * **RM_OBJECT**: Return the `referenceModelObject` in the older Nedap specific JSON format. Matches `ArchieJacksonConfiguration.createLegacyConfiguration` in the Archie library. `pathsAndValues` will be empty.

        * **RM_OBJECT_STANDARDS_COMPLIANT_JSON**: Return the `referenceModelObject` compliant with the openEHR JSON specification. Matches `ArchieJacksonConfiguration.createStandardsCompliant` in the Archie library. `pathsAndValues` will be empty.'
      example: RM_OBJECT
    openehr.CompositionValidationErrorResponse:
      type: object
      properties:
        errorResponseEntries:
          type: array
          items:
            $ref: '#/components/schemas/openehr.CompositionValidationErrorEntry'
      description: Returned when a composition could not be created or updated because it failed validation. Contains one entry per validation error found. The property is named errorResponseEntries so that clients written against ErrorResponse keep working.
      example:
        errorResponseEntries:
        - field: /content[id0001]/data
          value: ''
          archetypeId: openEHR-EHR-EVALUATION.problem_diagnosis.v1
          archetypePath: /data
          message: Attribuut data van class EVALUATION komt niet overeen met existence 1..1
          type: REQUIRED
        - field: /content[id0006]/data[id0002]/events[id0003]/data[id0004]/items[id0005]/value
          value: '5'
          archetypeId: openEHR-EHR-OBSERVATION.braden_scale.v1
          archetypePath: /data[id0002]/events[id0003]/data[id0004]/items[id0005]/value
          message: "Object komt niet overeen met tupel: [value, symbol] ∈ {\n\t[{4}, {[at66]}],\n\t[{3}, {[at67]}],\n\t[{2}, {[at68]}],\n\t[{1}, {[at69]}],\n\t[{0}, {[at70]}]\n}"
          type: DEFAULT
    openehr.CompositionValidationErrorEntryType:
      enum:
      - DEFAULT
      - REQUIRED
      - WRONG_TYPE
      - CARDINALITY_MISMATCH
      - EMPTY_OBSERVATION
      - ARCHETYPE_SLOT_ID_MISMATCH
      - ARCHETYPE_NOT_FOUND
      - INVARIANT_ERROR
      - EXCEPTION
      type: string
      description: 'The kind of validation error reported by a composition validation error entry.


        The `message` of an entry is raw output of the openEHR validator and is not understandable for end users. Clients should switch on this type to generate an understandable message themselves, and should treat an unknown type as `DEFAULT`.

        * **DEFAULT**: A validation error that does not fall into any of the other categories.

        * **REQUIRED**: A required element is missing.

        * **WRONG_TYPE**: The value at the field does not have the type required by the archetype.

        * **CARDINALITY_MISMATCH**: The cardinality of an attribute violates the cardinality constraint of the archetype.

        * **EMPTY_OBSERVATION**: An observation was submitted without any data.

