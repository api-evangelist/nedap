          type: string
          description: The path where the validation error occurred within the archetype identified by `archetypeId`. When the validation error is about a node in the archetype of the posted composition itself, this is the same as `field`.
        message:
          type: string
          description: Technical message from the openEHR validator describing why validation failed. These messages are not understandable for end users and may change at any time, so they should not be shown to users. Use `type` to generate an understandable message instead.
