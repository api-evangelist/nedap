  /t/openehr/composition_wrappers/by_item_tags:
    post:
      tags:
      - openehr.CompositionWrapper
      summary: Returns all compositions that contain all given item tags
      description: Only compositions that match all item tags with key and/or value are returned (AND semantics). At least one item tag needs to be provided and each should have a key and optionally a value. If an archetype id is provided, only the compositions of that archetype are returned. Results are ordered by first event time, most recent first. If module uuid's are provided, only the archetypes that are assigned to these modules are returned.
      operationId: openehr.CompositionWrapperAPI.byItemTags
      parameters:
      - name: client_id
        in: query
        description: The client id.
        required: true
        schema:
          type: integer
          format: int64
      - name: reference_model_object_form
        in: query
        description: The requested form of the compositions.
        required: true
        schema:
          $ref: '#/components/schemas/openehr.ReferenceModelObjectForm'
      - name: archetype_id
