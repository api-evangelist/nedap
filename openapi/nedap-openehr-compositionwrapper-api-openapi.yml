servers:
- url: https://api-development.ons.io
tags:
- name: openehr.CompositionWrapper
paths:
  /t/openehr/composition_wrappers:
    get:
      tags:
      - openehr.CompositionWrapper
      summary: Finds all CompositionWrappers of all clients that are an instance of the given…
      description: This API supports pagination by using limit, and by default will only return the 20 most recent results.
      operationId: openehr.CompositionWrapperAPI.all
      parameters:
      - name: client_id
        in: query
        description: The client id
        schema:
          type: integer
          format: int64
      - name: archetype_id
        in: query
        description: Id of the archetype that the requested compositions should be an instance of
        schema:
          type: string
      - name: reference_model_object_form
        in: query
        description: 'The requested form of the compositions. The options are:

          * **METADATA**: Return only the metadata. `referenceModelObject` and `pathsAndValues` will be empty.

          * **PATHS_AND_VALUES**: Return the `pathsAndValues`. `referenceModelObject` will be empty.

          * **RM_OBJECT**: Return the `referenceModelObject` in the older Nedap specific JSON format. Matches `ArchieJacksonConfiguration.createLegacyConfiguration` in the Archie library. `pathsAndValues` will be empty.

          * **RM_OBJECT_STANDARDS_COMPLIANT_JSON**: Return the `referenceModelObject` compliant with the openEHR JSON specification. Matches `ArchieJacksonConfiguration.createStandardsCompliant` in the Archie library. `pathsAndValues` will be empty.'
        required: true
        schema:
          $ref: '#/components/schemas/openehr.ReferenceModelObjectForm'
      - name: with_incomplete
        in: query
        description: Set to true to also include compositions with lifecycleState INCOMPLETE. By default only compositions with lifecycleState COMPLETE are included.
        schema:
          type: boolean
      - name: limit
        in: query
        description: Limits the number of results returned
        schema:
          maximum: 10000
          minimum: 1
          type: integer
          format: int32
      - name: offset
        in: query
        description: Offsets the number of records of the first result.
        schema:
          type: integer
          format: int32
      - name: valid_from
        in: query
        description: Starting time
        schema:
          type: string
          format: date
      - name: valid_to
        in: query
        description: End time
        schema:
          type: string
          format: date
      - name: updated_since
        in: query
        description: Fetch only the compositions that were updated on or after the given date
        schema:
          type: string
          format: local-date-time
        example: '2014-12-29T00:00:00'
      - name: item_tag_key
        in: query
        description: Fetch only the compositions associated with any of the provided item tag keys
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: module_uuid
        in: query
        description: UUID's of modules that the archetypes of the requested compositions should belong to
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: with_abandoned
        in: query
        description: Set to true to also include compositions with lifecycleState ABANDONED. By default only compositions with lifecycleState COMPLETE are included.
        schema:
          type: boolean
      - name: with_inactive
        in: query
        description: Set to true to also include compositions with lifecycleState INACTIVE. By default only compositions with lifecycleState COMPLETE are included.
        schema:
          type: boolean
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openehr.list.CompositionWrapperList'
        '400':
          description: Limit exceeds bounds (1-10000)
        '404':
          description: When the clientId does not exist
      x-cupido-common-method: true
      x-replaced-by: /v0/openehr_dossier/back_channel/unauthorized/composition_wrappers
      deprecated: true
      x-deprecated-since: 19-11-2025
    post:
      tags:
      - openehr.CompositionWrapper
      summary: Create CompositionWrapper
      description: Composition data can be provided by means of either paths and values or ReferenceModelObject. A provided ReferenceModelObject will be deserialized using the standard-compliant Jackson deserializer.
      operationId: openehr.CompositionWrapperAPI.createV2
      parameters:
      - name: reference_model_object_form
