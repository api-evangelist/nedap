          * **RM_OBJECT_STANDARDS_COMPLIANT_JSON**: Return the `referenceModelObject` compliant with the openEHR JSON specification. Matches `ArchieJacksonConfiguration.createStandardsCompliant` in the Archie library. `pathsAndValues` will be empty.'
        required: false
        schema:
          $ref: '#/components/schemas/openehr.ReferenceModelObjectForm'
      requestBody:
        description: CompositionWrapper to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/openehr.CompositionWrapper'
        required: true
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openehr.CompositionWrapper'
        '400':
          description: When the composition could not be created because it failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openehr.CompositionValidationErrorResponse'
      x-replaced-by: /v0/openehr_dossier/back_channel/unauthorized/composition_wrappers
      deprecated: true
      x-deprecated-since: 19-11-2025
    delete:
