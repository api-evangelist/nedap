        description: The id of the client in Ons Administratie for which the data is requested
        required: true
        schema:
          type: integer
          format: int64
      - name: reference_model_object_form
        in: query
        description: 'The requested form of the compositions. The options are:

          * **METADATA**: Return only the metadata. `referenceModelObject` and `pathsAndValues` will be empty.

          * **PATHS_AND_VALUES**: Return the `pathsAndValues`. `referenceModelObject` will be empty.

          * **RM_OBJECT**: Return the `referenceModelObject` in the older Nedap specific JSON format. Matches `ArchieJacksonConfiguration.createLegacyConfiguration` in the Archie library. `pathsAndValues` will be empty.

          * **RM_OBJECT_STANDARDS_COMPLIANT_JSON**: Return the `referenceModelObject` compliant with the openEHR JSON specification. Matches `ArchieJacksonConfiguration.createStandardsCompliant` in the Archie library. `pathsAndValues` will be empty.'
        required: true
        schema:
          $ref: '#/components/schemas/openehr.ReferenceModelObjectForm'
      - name: with_authorized_employee_groups
        in: query
        description: Set this to true if the response should also include the employee groups who are allowed to read or update the composition
        schema:
          type: boolean
          default: false
      - name: with_item_tags
        in: query
        description: Set this to true if the response should also include the item tags connected to the composition
        schema:
          type: boolean
          default: false
      - name: lifecycle_state
        in: query
        description: 'List of lifecycle states that the compositions should be in, should be called in style: ?lifecycle_state=ABANDONED&lifecycle_state=INACTIVE'
        required: false
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/openehr.LifecycleState'
