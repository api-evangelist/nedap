            createdById: 1
            updatedById: 1
            createdAt: '2020-11-14T00:00:00.000+01:00'
            updatedAt: '2020-11-14T00:00:00.000+01:00'
            uuid: 02a26900-64d4-11e4-b4af-0002a5d5c51d
