      - authorization.provisioning.UserScopeSettings
      summary: Updates scope settings of a user
      description: 'Updates scope settings of a user. Provide the complete set of legacy_auth_scoping_options that should be assigned to the user.

        As this API is idempotent, the state provided in the last call is the final state. Any scopes previously added but not specified in the body will be removed.

        This endpoint together with /my_teams and /my_locations are replacements for the PUT /users/{user_uuid}/scopes endpoint.'
