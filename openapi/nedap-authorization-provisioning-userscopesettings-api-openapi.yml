      parameters:
      - name: user_uuid
        in: path
        description: Identifier of User to update.
        required: true
        schema:
          type: string
      requestBody:
        description: the new set of scope settings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorization.provisioning.UserScopeSettings'
        required: true
      responses:
        '200':
          description: User scope settings have been updated
