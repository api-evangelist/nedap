components:
  schemas:
    LocationAssignmentResidence:
      type: object
      allOf:
      - $ref: '#/components/schemas/LocationAssignment'
      properties:
        careOrderObjectId:
          type: integer
          description: 'The careorder where this locationassignment belongs to.

            This is needed to be able to create a declaration based on locationassignments'
          format: int64
        hourTypeObjectId:
          type: integer
          description: 'The kind of care that is given using this locationassignment. Example: GGZ verblijf licht

            This is needed to be able to create a declaration based on locationassignments'
          format: int64
        productObjectId:
          type: integer
          description: 'Deprecated since: 14-03-2019 - use hourTypeObjectId instead.'
          format: int64
          deprecated: true
      description: LocationAssignmentResidence model (no description)
      example:
        id: 1
        beginDate: '2012-08-02'
        beginTime: '10:11:00.000'
        endDate: '2012-08-02'
        endTime: '12:13:00.000'
        clientObjectId: 1
        locationObjectId: 1
        moveDate: '2012-08-02'
        locationAssignmentType: MAIN
        residence: false
        mainLocation: true
        medicineLocation: true
        careOrderObjectId: 1
        hourTypeObjectId: 1
        productObjectId: 1
      xml:
        name: locationAssignmentResidence
    list.LocationAssignmentResidenceList:
      type: object
      properties:
        locationAssignmentResidences:
          type: array
          items:
            $ref: '#/components/schemas/LocationAssignmentResidence'
      description: LocationAssignmentResidenceList model (no description)
      example:
        locationAssignmentResidences:
        - id: 1
          beginDate: '2012-08-02'
          beginTime: '10:11:00.000'
          endDate: '2012-08-02'
          endTime: '12:13:00.000'
          clientObjectId: 2
          locationObjectId: 3
          moveDate: '2012-08-02'
          locationAssignmentType: MAIN
          residence: false
          mainLocation: true
          medicineLocation: false
    LocationAssignmentType:
      enum:
      - STANDARD
      - MAIN
      - MEDICINE
      - GGZ
      - WAITING_LIST
      type: string
      description: LocationAssignmentType enum (no description)
      example: STANDARD
    LocationAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          x-cupido-id: true
        beginDate:
          type: string
          format: date
        beginTime:
          type: string
          format: time
        endDate:
          type: string
          format: date
        endTime:
          type: string
          format: time
        clientObjectId:
          type: integer
          format: int64
        locationObjectId:
          type: integer
          format: int64
        moveDate:
          type: string
          format: date
        locationAssignmentType:
          $ref: '#/components/schemas/LocationAssignmentType'
        residence:
          type: boolean
          description: Indicates if the client resides at this location
        mainLocation:
          type: boolean
          description: 'Deprecated since: 14-03-2019 - use locationAssignmentType instead'
          deprecated: true
        medicineLocation:
          type: boolean
          description: 'Deprecated since: 14-03-2019 - use locationAssignmentType instead'
          deprecated: true
      description: LocationAssignment model (no description)
      example:
        id: 1
        beginDate: '2012-08-02'
        beginTime: '10:11:00.000'
        endDate: '2012-08-02'
        endTime: '12:13:00.000'
        clientObjectId: 2
        locationObjectId: 3
        moveDate: '2012-08-02'
        locationAssignmentType: MAIN
        residence: false
        mainLocation: true
        medicineLocation: false
      xml:
        name: locationAssignment
