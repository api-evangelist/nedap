components:
  schemas:
    toezicht.AuditReferences:
      type: object
      properties:
        clients:
          type: array
          items:
            type: integer
      description: References linked to an exported Audit
      example:
        clients:
        - 10
        - 12
    toezicht.list.AuditList:
      required:
      - audits
      type: object
      properties:
        audits:
          type: array
          items:
            $ref: '#/components/schemas/toezicht.Audit'
      description: List of exported audits.
      example:
        audits:
        - activeIdentity:
            employeeId: 10
            userName: administrator
          createdAt: '2024-01-01T01:35:19.498+01:00'
          deploymentType: PlanningDeployment
          description: Sync Notes.
          failed: false
          name: SyncClient::NotesSyncJob
          references:
            clients:
            - 10
            - 12
          title: Overnemen cliëntnotities uit Ons Dossier
    toezicht.AuditIdentity:
      type: object
      properties:
        employeeId:
          type: integer
          description: Some audits store the employee_id captured when the audit event was created. For audits without a stored employee_id, this value is resolved from other ONS data sources at the moment of export. It may not be available in all cases. If the user is removed from Administration, the employee_id may no longer be available for audits of some types.
        userName:
          type: string
      description: Identity linked to an exported Audit
      example:
        employeeId: 10
        userName: administrator
    toezicht.Audit:
      required:
      - createdAt
      type: object
      properties:
        activeIdentity:
          $ref: '#/components/schemas/toezicht.AuditIdentity'
        createdAt:
          type: string
        deploymentType:
          type: string
        description:
          type: string
        failed:
          type: boolean
        name:
          type: string
        references:
          $ref: '#/components/schemas/toezicht.AuditReferences'
        title:
          type: string
      description: A single exported audit
      example:
        activeIdentity:
          employeeId: 10
          userName: administrator
        createdAt: '2024-01-01T01:35:19.498+01:00'
        deploymentType: PlanningDeployment
        description: Sync Notes.
        failed: false
        name: SyncClient::NotesSyncJob
        references:
          clients:
          - 10
          - 12
        title: Overnemen cliëntnotities uit Ons Dossier
