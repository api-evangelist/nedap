info:
  title: Nedap Toezicht.Audit API
  version: 0.0.0
  description: 'Operations tagged toezicht.Audit across 2 of this provider''s published API definitions: nedap-ons-deprecated-openapi-original.json, nedap-ons-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-development.ons.io
tags:
- name: toezicht.Audit
paths:
  /t/auditing/export:
    get:
      tags:
      - toezicht.Audit
      summary: Export audits for a given time period
      description: Exports audits for a given time period. Returns JSON data.
      operationId: toezicht.AuditAPI.streamExport
      parameters:
      - name: date_from
        in: query
        description: Start date of exported audits (included)
        required: true
        schema:
          type: string
      - name: date_to
        in: query
        description: End date of exported audits (included)
        required: true
        schema:
          type: string
      - name: titles
        in: query
        description: 'Patterns used to filter audits by title, format: titles=title1&titles=title2&titles=title3'
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: user_uuids
        in: query
        description: 'Filter audits by user UUID, format: user_uuids=uuid1&user_uuids=uuid2'
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: client_ids
        in: query
        description: 'Filter audits by referenced client id, format: client_ids=1&client_ids=2'
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: names
        in: query
        description: 'Filter audits by exact name, format: names=name1&names=name2'
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: applications
        in: query
        description: 'Filter audits by originating application, format: applications=app1&applications=app2'
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: system
        in: query
        description: Filter on system (background) audits. true = only system, false = exclude system
        schema:
          type: boolean
      - name: failed
        in: query
        description: Filter on failed audits. true = only failed, false = only successful
        schema:
          type: boolean
      - name: with_nonempty_references
        in: query
        description: When true, only return audits referencing a client or employee. Only true is accepted
        schema:
          enum:
          - true
          type: boolean
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toezicht.list.AuditList'
      x-replaced-by: /v0/auditing/export
