components:
  schemas:
    payroll.PayableHoursAverage:
      required:
      - value
      - perDay
      - employeeId
      type: object
      properties:
        value:
          type: number
          description: The average number of payable hours for the requested period for the specified employee.
          format: float
        perDay:
          type: boolean
          description: Indicating that the value is per day, or otherwise per week.
        dayOfWeek:
          type: integer
          description: 'ISO8601 day of week number, where Monday (1) is the first day of the week, and Sunday (7) is the last, idnicating which day of the week this {@code PayableHoursAverage} represents.

            Only set when {@code perDay} is {@code true}'
          format: int32
        employeeId:
          type: integer
          format: int64
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          description: the last date for which this average is valid, inclusive
          format: date
      description: PayableHoursAverage model (no description)
      example:
        value: 123.45
        perDay: false
        dayOfWeek: 4
        employeeId: 1
        validFrom: '2021-12-16'
        validTo: '2021-12-16'
      xml:
        name: payableHoursAverage
    payroll.list.PayableHoursAverageList:
      type: object
      properties:
        payableHoursAverages:
          type: array
          items:
            $ref: '#/components/schemas/payroll.PayableHoursAverage'
      description: PayableHoursAverageList model (no description)
      example:
        payableHoursAverages:
        - value: 123.45
          perDay: true
          dayOfWeek: 4
          employeeId: 1
          validFrom: '2021-12-16'
          validTo: '2021-12-16'
        - value: 456.78
          perDay: true
          dayOfWeek: 5
          employeeId: 1
          validFrom: '2021-12-17'
          validTo: '2021-12-17'
