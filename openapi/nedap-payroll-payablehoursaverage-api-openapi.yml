  /t/payroll/payable_hours_averages/on_day_of_week_in_period/{employee_id}:
    get:
      tags:
      - payroll.PayableHoursAverage
      summary: Get the average payable hours for a given day of the week, for the specified…
      description: 'use {@link #onDaysOfWeekInPeriod(Long, LocalDate, LocalDate, List, List)} instead The default period is last thirteen weeks.

        Only payable hours are included. Shifts are not automatically payable hours. Only the parts of the shift for which active work was booked.

        We include payrolling, vacation, sick leave, PLB vacation, LFB, moved shifts, moved shift day off, calls during shifts, and overtime.'
      operationId: payroll.PayableHoursAverageAPI.onDayOfWeekInPeriod
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: valid_from
        in: query
        schema:
          type: string
          format: date
      - name: valid_to
        in: query
        schema:
          type: string
          format: date
      - name: day_of_week
        in: query
        description: ISO8601 day of week number, where Monday (1) is the first day of the week, and Sunday (7) is the last. {@see java.time.DayOfWeek}
        schema:
          type: integer
          format: int32
      - name: hour_type_id
        in: query
        description: 'array style id''s: hour_type_id=1&hour_type_id=2&etc'
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: X-Cupido-User-Name
        in: header
        schema:
          type: string
      - name: X-Cupido-Active-Identity
        in: header
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payroll.PayableHoursAverage'
        '400':
          description: Employee is required and must be under contract in the requested period
