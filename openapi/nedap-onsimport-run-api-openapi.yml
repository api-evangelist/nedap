      x-replaced-by: /v0/import/run/{run_id}/validations
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/binary:
    post:
      tags:
      - onsimport.Run
      summary: Uploads a binary file to be processed by Ons Import
      description: 'Refer to the

        Ons Import documentation on how to incorporate these files into an

        import. The upload will be processed asynchronously, so an

        uploadId is returned that can be used to poll for the status.'
      operationId: onsimport.RunAPI.uploadBinaryFile
      requestBody:
        description: "a request object containing the run id and\n the binary file to be imported."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/onsimport.BinaryFileRequest'
        required: true
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.UploadResponse'
        '404':
          description: Run not found
      x-replaced-by: /v0/import/run/binary
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/xml:
    post:
