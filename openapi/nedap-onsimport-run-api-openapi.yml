openapi: 3.2.0
info:
  title: Nedap Onsimport.Run API
  version: 0.0.0
  description: 'Operations tagged onsimport.Run across 2 of this provider''s published API definitions: nedap-ons-deprecated-openapi-original.json, nedap-ons-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-development.ons.io
tags:
- name: onsimport.Run
paths:
  /t/onsimport/runs:
    get:
      tags:
      - onsimport.Run
      summary: Returns a list of all runs
      operationId: onsimport.RunAPI.getAll
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.list.RunList'
      x-replaced-by: /v0/import/run
      deprecated: true
      x-deprecated-since: 19-11-2025
    post:
      tags:
      - onsimport.Run
      summary: Creates a new run
      operationId: onsimport.RunAPI.create
      requestBody:
        description: contains information about the new run.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/onsimport.Run'
        required: true
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.Run'
      x-cupido-common-method: true
      x-replaced-by: /v0/import/run
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/{run_id}:
    delete:
      tags:
      - onsimport.Run
      summary: Deletes a run and any corresponding records, lookups, files and validations
      description: 'A run can only be deleted if no records have been

        successfully imported (status = SUCCESS).'
      operationId: onsimport.RunAPI.delete
      parameters:
      - name: run_id
        in: path
        description: the id of the run to be deleted.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.Run'
      x-replaced-by: /v0/import/run/{run_id}
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/{run_id}/idlist:
    get:
      tags:
      - onsimport.Run
      summary: Requests generating an ID list for a run
      description: As the ID list will be generated asynchronously, this call will return a RunReport containing a reportId. Use the reportId to download the report in a separate call.
      operationId: onsimport.RunAPI.getIdList
      parameters:
      - name: run_id
        in: path
        description: a run id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.RunReport'
      x-replaced-by: /v0/import/run/{run_id}/idlist
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/{run_id}/report:
    get:
      tags:
      - onsimport.Run
      summary: Requests generating a report for a run
      description: 'As the report will be generated

        asynchronously, this call will return a RunReport containing a reportId.

        Use the reportId to download the report in a separate call.'
      operationId: onsimport.RunAPI.getReport
      parameters:
      - name: run_id
        in: path
        description: a run id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/onsimport.RunReport'
      x-replaced-by: /v0/import/run/{run_id}/report
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/onsimport/runs/{run_id}/report/{report_id}:
    get:
      tags:
      - onsimport.Run
      summary: Returns a report for a run
      description: 'If the report is ready, it will be returned

        in the RunReport. Otherwise, the report field will be null;

        wait and try again. Reports will be available for a limited time

        (2 hours) after generating.'
      operationId: onsimport.RunAPI.getGeneratedReport
      parameters:
      - name: run_id
        in: path
        description: a run id.
        required: true
        schema:
          type: string
      - name: report_id
        in: path
        description: a reportId that was obtained earlier.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
