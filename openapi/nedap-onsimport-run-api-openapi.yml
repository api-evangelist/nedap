components:
  schemas:
    onsimport.UploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          description: Unique id for requesting status info about the upload.
      description: 'Contains a unique id by which information about an

        upload can be retrieved.'
      example:
        uploadId: uploadid
      xml:
        name: uploadResponse
    AuditedBase:
      title: AuditedBase
      type: object
      properties:
        updatedAt:
          type:
          - string
          - 'null'
          description: Dated Base extension.
          format: date-time
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          type:
          - string
          - 'null'
      description: AuditedBase model (no description)
      example:
        updatedAt: '2014-12-29T00:00:00.000+01:00'
        createdAt: '2014-12-29T00:00:00.000+01:00'
        createdBy: example
    onsimport.RunStatus:
      type: object
      properties:
        runId:
          type: string
          description: Object identifier of the run, usually in the form of a UUID.
        processing:
          type: boolean
          description: Indicates records are still being processed.
        statuses:
          type: object
          description: 'Map of record status to number of records having that status.

            Also contains an entry ALL with the total number of records.'
        fileValidations:
          type: array
          items:
            type: string
          description: 'List of validation messages resulting from uploading XML.

            These typically concern invalid XML or XSD violations.'
      description: Contains status information about a run in Ons Import.
      example:
        runId: runwithme
        processing: false
        statuses:
          all: '1'
          success: '1'
        fileValidations:
        - failtorun
    onsimport.BinaryFileRequest:
      type: object
      properties:
        runId:
          type: string
          description: Object identifier of the run, usually in the form of a UUID.
        fileName:
          type: string
          description: File name of the binary file, optionally including a path.
        content:
          type: string
          description: Content of the binary file.
          format: binary
      description: Contains a binary file to be added to a run in Ons Import.
      example:
        runId: runwithme
        fileName: runwithme.pdf
        content: JVBERi1jb250ZW50JSVFT0Y=
      xml:
        name: binaryFileRequest
    onsimport.list.ValidationList:
      type: object
      properties:
        validations:
          type: array
          items:
            $ref: '#/components/schemas/onsimport.Validation'
      description: ValidationList model (no description)
      example:
        validations:
        - updatedAt: '2020-05-07T00:00:00.000+02:00'
          createdAt: '2020-05-07T00:00:00.000+02:00'
          createdBy: tanneberger
          id: 1
          field: name
          value: Running A Wrong Way
          message: WrongNameException
          recordId: 991
          recordStatus: INVALID
          domain: Run
          importId: '001'
        - updatedAt: '2020-05-07T00:00:00.000+02:00'
          createdAt: '2020-05-07T00:00:00.000+02:00'
          createdBy: tanneberger
          id: 2
          field: name
          value: Running A Wrong Way
          message: BadSongException
          recordId: 991
          recordStatus: INVALID
          domain: Run
          importId: '001'
    onsimport.list.RunList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/onsimport.Run'
          xml:
            name: run
      description: RunList model (no description)
      example:
        runs:
        - updatedAt: '2020-03-25T00:00:00.000+01:00'
          createdAt: '2020-03-25T00:00:00.000+01:00'
          createdBy: htaylor
          id: runwithme
          name: Run With Me
          autoProcess: true
          quickMatch: true
      xml:
        name: runs
    onsimport.list.UploadInfoList:
      type: object
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/onsimport.UploadInfo'
      description: Contains uploaded files for a run in Ons Import.
      example:
        uploads:
        - runId: runwithme
          runName: Run With Me
          uploadId: uploadid
          fileName: records.xml
          createdAt: '2026-04-07T10:57:00.000+02:00'
    onsimport.RunReport:
      type: object
      properties:
        reportId:
          type: string
          description: Unique id for requesting the generated report.
        report:
          type: string
          description: An Excel report for the run.
          format: binary
      description: Contains an Excel report for a run.
      example:
        reportId: reportid
        report: QWxsIGhvcGUgaXMgbG9zdA==
    onsimport.RecordsXmlRequest:
      type: object
      properties:
        runId:
          type: string
          description: Object identifier of the run, usually in the form of a UUID.
        xml:
          type: string
          description: 'XML as specified by the Ons Import XSD, optionally

            Base64 encoded.'
      description: 'Contains records to be added to a run in Ons Import,

        formatted as XML as specified by the Ons Import XSD.'
      example:
        runId: runwithme
        xml: <import></import>
      xml:
        name: recordsXmlRequest
    onsimport.UploadInfo:
