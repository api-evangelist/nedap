          type: integer
          format: int64
          x-cupido-id: true
        description:
          type: string
        title:
          type: string
        active:
          type: boolean
        useWorkflow:
          type: boolean
        useStrictEditAuthorization:
          type: boolean
        copyingAllowed:
          type: boolean
        signalNonClosed:
          type: boolean
          description: 'Setting no longer provided by Ons Administratie 2016.5.0+

            Instances of this questionaire need to be signaled on the dashboard when incomplete

            '
          deprecated: true
        signalTitle:
          type: string
          description: 'Setting no longer provided by Ons Administratie 2016.5.0+

            Title of the dashboard signal

            '
          deprecated: true
        daysToExpiration:
          type: integer
