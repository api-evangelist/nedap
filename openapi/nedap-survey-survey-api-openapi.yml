      summary: Survey survey API by id
      x-summary-source: derived
    put:
      tags:
      - survey.Survey
      summary: Updates the given Survey
      operationId: survey.SurveyAPI.update
      parameters:
      - name: id
        in: path
        description: Identifier of Survey to update.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Survey to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/survey.Survey'
        required: true
      responses:
