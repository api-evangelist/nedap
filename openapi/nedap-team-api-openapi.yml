components:
  schemas:
    TeamAddress:
      type: object
      allOf:
      - $ref: '#/components/schemas/Address'
      properties:
        teamId:
          type: integer
          format: int64
      description: The address of a team
      example:
        id: 1
        beginDate: '2010-02-16'
        endDate: '2010-02-17'
        homeNumber: 4
        homeNumberExtension: a
        poBoxNumber: 123a
        street: Parallelweg
        city: Enschede
        zipcode: 7513KC
        municipality: Enschede
        country: Netherlands
        telephoneNumber: 053-1234567
        telephoneCountryCode: '+31'
        telephoneNumber2: 053-1234567
        telephoneCountryCode2: '+31'
        faxNumber: 053-1234567
        email: mike.wazowski@nedap.com
        type: '98'
        typeString: Other address
        residentType: '0'
        personType: '6'
        personTypeString: cluster
        roomNumber: '1'
        locationDescription: Afdeling noord
        updatedAt: '2016-01-01T12:00:00.000+01:00'
        createdAt: '2016-01-01T12:00:00.000+01:00'
        latitude: 52.1
        longitude: 6.9
        teamId: 2
        situationDescription: Test
        residenceAccessInfo: Test
      xml:
        name: teamAddress
    list.TeamList:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
          xml:
            name: team
      description: TeamList model (no description)
      example:
        teams:
        - id: 1
          beginDate: '1999-12-31T23:00:00.000+01:00'
          externCode: ''
          identificationNo: '0001'
          name: Nedap Demo
          poolTeam: false
          costCenterNumber: '0001'
          parentObjectId: 0
      xml:
        name: teams
    Team:
      title: Team
      type: object
      properties:
        id:
          type: integer
          format: int64
          x-cupido-id: true
        beginDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        externCode:
          type:
          - string
          - 'null'
        identificationNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        poolTeam:
          type:
          - boolean
          - 'null'
        costCenterNumber:
          type:
          - string
          - 'null'
        parentObjectId:
          type:
          - integer
          - 'null'
          format: int64
        addresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TeamAddress'
      description: Team (Cluster)
      example:
        id: 1
        beginDate: '2000-01-01T00:00:00.000+01:00'
        endDate: '2001-01-01T00:00:00.000+01:00'
        externCode: agb
        identificationNo: '0001'
        name: Nedap Demo
        poolTeam: false
        costCenterNumber: '0001'
        parentObjectId: 0
        addresses: []
      xml:
        name: team
    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
          x-cupido-id: true
        beginDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        homeNumber:
          type: integer
          format: int32
        homeNumberExtension:
          type: string
        poBoxNumber:
          type: string
        street:
          type: string
        city:
          type: string
        zipcode:
          type: string
        municipality:
          type: string
        country:
          type: string
        telephoneNumber:
          type: string
        telephoneCountryCode:
          type: string
        telephoneNumber2:
          type: string
        telephoneCountryCode2:
          type: string
        faxNumber:
          type: string
        email:
          type: string
        type:
          type: string
          description: '0: Unknown

            1: Living

            2: Postal

            3: Residence

            4: Temporary

            50: Sleuteladres

            98: Other

            100: Factuuradres'
        typeString:
          type: string
        residentType:
          type: string
          description: '0: Unknown

            1: One-family house

            2: Upstairs apartment

            3: Ground floor apartment

            4: Apartment or flat

            5: Apartment or flat, with elevator between floors

            6: Houseboat

            7: Trailer

            8: WLZ organisation (with stay facilities)

            9: Homeless

            11: Assisted living

            12: WLZ organisation

            13: ZVW organisation

            14: WMO organisation

            21: asylum seekers center

            31: Correctional Institution

            99: Other'
        personType:
          type: string
          description: '1: Client

            2: Employee

            3: Relation

            4: Careprovider

            5: Unit'
        personTypeString:
          type: string
        roomNumber:
          type: string
        locationDescription:
          type: string
        updatedAt:
