openapi: 3.2.0
info:
  title: Nedap Team API
  version: 0.0.0
  description: 'Operations tagged Team across 2 of this provider''s published API definitions: nedap-ons-deprecated-openapi-original.json, nedap-ons-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-development.ons.io
tags:
- name: Team
paths:
  /t/employees/{employee_id}/teams:
    get:
      tags:
      - Team
      summary: Return the teams of a Employee corresponding to the given id between 2 dates
      operationId: TeamAPI.byEmployeeId
      parameters:
      - name: employee_id
        in: path
        description: The identifier of the employee for which to retrieve teams
        required: true
        schema:
          type: integer
          format: int64
      - name: valid_from
        in: query
        schema:
          type: string
          format: date
      - name: valid_to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.TeamList'
      x-replaced-by: /v0/administration/employees/{employee_id}/clipped_teams
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/teams:
    get:
      tags:
      - Team
      summary: Return all teams
      operationId: TeamAPI.all
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list.TeamList'
      x-cupido-common-method: true
      x-replaced-by: /v0/administration/teams
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
    - url: https://api-development.ons.io
  /t/teams/{id}:
    get:
      tags:
      - Team
      summary: Return the Team corresponding to the given id
      operationId: TeamAPI.byId
      parameters:
      - name: id
        in: path
        description: used for selecting Team
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: No response was specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          description: Team not found
      x-cupido-common-method: true
      x-replaced-by: /v0/administration/teams/{id}
      deprecated: true
      x-deprecated-since: 19-11-2025
    servers:
