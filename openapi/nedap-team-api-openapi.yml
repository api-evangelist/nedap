      - Team
      summary: Method used for requesting multiple Team objects using their ids
      operationId: TeamAPI.multiple
      parameters:
      - name: id
        in: query
        description: 'array style id''s: id=1&id=2&etc'
        style: form
        explode: true
        schema:
