              uuid: 042f53df-37e5-4ad7-af77-16a212763bba
            updatedAt: '2017-10-02T21:10:43.000+02:00'
            uuid: 042f53df-37e5-4ad7-af77-16a212763bba
          requestDate: '2024-03-10'
          startDate: '2024-03-11'
          stopDate: '2024-03-12'
          status: INACTIVE
          updatedAt: '2017-10-02T21:10:43.000+02:00'
          uuid: 042f53df-37e5-4ad7-af77-16a212763bba
        requester:
          emailAddress: teamoost@groenlozorg.nl
          employeeObjectId: 1
          name: M. Edewerker
          phoneNumber: 0612345678
          teamName: Groenlo Oost
          teamObjectId: 1
        returnMethod: PICKUP
        returnNumber: '1234'
        status: OPEN
        supplierNote: Device is incomplete
        trackingUrl: https://post.nl?trackingNumber=6318638
        updatedAt: '2024-03-18T16:45:00.000+01:00'
        uuid: 042f53df-37e5-4ad7-af77-16a212763bba
    caretech.PickupAddress:
      required:
      - city
      - country
      - homeNumber
      - street
      - type
      - zipcode
      type: object
      properties:
        city:
          minLength: 1
          type: string
        country:
          pattern: ^[A-Z]{2}$
          type: string
        homeNumber:
          type: integer
          format: int32
        homeNumberExtension:
          type: string
        note:
          type: string
          deprecated: true
          x-deprecated-since: 22-07-2026
        roomNumber:
          type: string
        street:
          minLength: 1
          type: string
        type:
          $ref: '#/components/schemas/caretech.AddressType'
        zipcode:
          minLength: 1
          type: string
      description: PickupAddress model (no description)
      example:
        city: Groenlo
        country: NL
        homeNumber: 12
        homeNumberExtension: A
        note: Ring the bell twice
        roomNumber: '3'
        street: Parallelweg
        type: CLIENT_HOME
        zipcode: 7141DC
    caretech.ReturnRequestStatusUpdate:
      enum:
      - DECLINED
      - ACCEPTED
      - COMPLETED
      type: string
      description: The status update of a return request, can be DECLINED, ACCEPTED or COMPLETED
      example: ACCEPTED
    caretech.Status:
      enum:
      - REQUEST
      - ACTIVE
      - INACTIVE
      - UNKNOWN
      type: string
      description: The status of a product allocation, can be REQUEST, ACTIVE, INACTIVE or UNKNOWN
      example: ACTIVE
    caretech.AddressType:
      enum:
      - CLIENT_HOME
      - CLIENT_CARE_ALLOCATION
      - MANUAL
      type: string
      description: The delivery address type, can be CLIENT_HOME, CLIENT_CARE_ALLOCATION, MANUAL
      example: CLIENT_HOME
    caretech.ReturnRequestUpdate:
      required:
      - requestStatusUpdate
      type: object
      properties:
        requestStatusUpdate:
          $ref: '#/components/schemas/caretech.ReturnRequestStatusUpdate'
        returnNumber:
          maxLength: 100
          minLength: 0
          type: string
        supplierNote:
          maxLength: 140
          minLength: 0
          type: string
        trackingUrl:
          maxLength: 1024
          minLength: 0
          type: string
      description: ReturnRequestUpdate model (no description)
      example:
        requestStatusUpdate: DECLINED
        returnNumber: '1234'
        supplierNote: Device is incomplete
        trackingUrl: https://post.nl?trackingNumber=6318638
    caretech.Requester:
      required:
      - emailAddress
      - employeeObjectId
      - name
      - phoneNumber
      - teamName
      - teamObjectId
      type: object
      properties:
        emailAddress:
          type: string
        employeeObjectId:
          type: integer
          format: int64
        name:
          type: string
        phoneNumber:
          type: string
        teamName:
          type: string
        teamObjectId:
          type: integer
          format: int64
      description: The person who creates the care technology order
      example:
        emailAddress: teamoost@groenlozorg.nl
        employeeObjectId: 1
        name: M. Edewerker
        phoneNumber: 0612345678
        teamName: Groenlo Oost
        teamObjectId: 1
    caretech.ProductAllocation:
      required:
      - clientId
      - productInstance
      type: object
      properties:
        clientId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        employeeUuid:
          type: string
          format: uuid
        id:
          type: integer
          format: int64
          x-cupido-id: true
        productInstance:
          $ref: '#/components/schemas/caretech.ProductInstanceDto'
        requestDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        stopDate:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/caretech.Status'
          description: The status of a product allocation, can be REQUEST, ACTIVE, INACTIVE or UNKNOWN
        updatedAt:
          type: string
          format: date-time
        uuid:
          type: string
          format: uuid
      description: Caretech product which is allocated by a client
      example:
        clientId: 1
        createdAt: '2017-10-02T21:10:43.000+02:00'
        employeeUuid: 042f53df-37e5-4ad7-af77-16a212763bba
        id: 4
        productInstance:
          createdAt: '2017-10-02T21:10:43.000+02:00'
          externalId: serial-12345678
          id: 56
          product:
            createdAt: '2017-10-02T21:10:43.000+02:00'
            id: 1
            manufacturer: Nedap
            name: Nedap Luna
            updatedAt: '2017-10-02T21:10:43.000+02:00'
            uuid: 042f53df-37e5-4ad7-af77-16a212763bba
          updatedAt: '2017-10-02T21:10:43.000+02:00'
          uuid: 042f53df-37e5-4ad7-af77-16a212763bba
        requestDate: '2024-03-10'
        startDate: '2024-03-11'
        stopDate: '2024-03-12'
        status: INACTIVE
        updatedAt: '2017-10-02T21:10:43.000+02:00'
        uuid: 042f53df-37e5-4ad7-af77-16a212763bba
      xml:
        name: productAllocation
    caretech.ReturnMethod:
      enum:
      - PICKUP
      - DROP_OFF
      type: string
      description: The method type of returning the caretechnology device
      example: PICKUP
    caretech.ProductDto:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        manufacturer:
          type: string
        name:
          type: string
        orderable:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        uuid:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        stopDate:
          type: string
          format: date
      description: Caretech product
      example:
        createdAt: '2017-10-02T21:10:43.000+02:00'
        id: 1
        manufacturer: Nedap
        name: Nedap Luna
        orderable: false
        updatedAt: '2017-10-02T21:10:43.000+02:00'
        uuid: 042f53df-37e5-4ad7-af77-16a212763bba
        startDate: '2024-01-02'
        stopDate: '2024-04-17'
      xml:
        name: productDto
    caretech.ReturnRequestStatus:
      enum:
      - OPEN
      - DECLINED
      - ACCEPTED
      - COMPLETED
      type: string
      description: The status of a return request, can be OPEN, DECLINED, ACCEPTED or COMPLETED
      example: OPEN
