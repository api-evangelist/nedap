      description: ReturnRequestList model (no description)
      example:
        returnRequests:
        - acceptedAt: '2024-03-15T10:00:00.000+01:00'
          clientIdentificationNo: '123456789'
          completedAt: '2024-03-20T14:30:00.000+01:00'
