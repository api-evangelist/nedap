          city: Groenlo
          country: NL
          homeNumber: 12
          homeNumberExtension: A
          note: Ring the bell twice
          roomNumber: '3'
          street: Parallelweg
          type: CLIENT_HOME
          zipcode: 7141DC
        preferredPickupDays: mon,tue,wed
        productAllocation:
          clientId: 1
          createdAt: '2017-10-02T21:10:43.000+02:00'
          employeeUuid: 042f53df-37e5-4ad7-af77-16a212763bba
          id: 4
