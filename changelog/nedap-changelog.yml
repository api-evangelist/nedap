note: >-
  Nedap publishes no dated changelog or release-notes feed for Ons API. What exists
  instead is a set of one-off change notices embedded in the docs pages themselves — a
  "Recent changes" block on the Webhooks page and a standalone migration article — each
  carrying a real removal date but no date of publication. There is no RSS feed, no
  archive and no way to diff two points in time. The Productboard "product developments"
  portal covers planned work rather than shipped change. Recording the two published
  notices here; this is a genuine gap in Nedap's operational transparency, not an
  absence of change.
