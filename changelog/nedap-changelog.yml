  type: deprecation
  source: https://ons-api.nl/english/technical/Webhooks.html
  highlights:
  - >-
    CUSTOM webhook events now carry event-specific data under payload. Integrations
    should read custom identifiers from payload; the deprecated top-level custom-event
    id remains for backwards compatibility only until it is removed after 1 Mar 2027.
- version: null
  date: null
  effective_until: '2026-05-19'
  type: breaking
  source: https://ons-api.nl/english/technical/API_migration_2025.html
  highlights:
  - >-
    Every endpoint path migrated from the /t/ prefix to /v0/<ons-suite-application>/.
    877 endpoints remapped; 41 with parameter changes. Old endpoints removed 2026-05-19.
  - >-
    operationIds and OpenAPI parameter order deliberately held stable so generated
    clients migrate by swapping the input specification.
